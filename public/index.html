<!doctype html>
<!-- Yondr marketing request portal (Worker yondr-marketing-requests). App: js/app.js; API: /api (src/index.ts). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Request marketing work at Yondr: brief it, get it approved, follow it to delivery." />
    <meta name="theme-color" content="#1C300B" />
    <title>Marketing requests · Yondr</title>
    <link rel="icon" href="/brand/yondr-dark-green.svg" type="image/svg+xml" />
    <link rel="preload" href="/brand/fonts/fraunces-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/brand/fonts/inter-tight-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/brand/fonts/inter-tight-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/wizard.css" />
    <link rel="stylesheet" href="/css/request.css" />
    <link rel="stylesheet" href="/css/work.css" />
    <link rel="modulepreload" href="/js/lib/ui.js" />
    <link rel="modulepreload" href="/js/lib/api.js" />
    <link rel="modulepreload" href="/js/shared/catalog.js" />
    <link rel="modulepreload" href="/js/shared/workflow.js" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="shell">
      <aside class="side" id="side" aria-label="Main">
        <div class="side-top">
          <div class="brand">
            <a class="brand-logo" href="https://overyondrdev.com/" aria-label="Yondr Dev Portal — all portals"
              ><img src="/brand/yondr-off-white.svg" alt="" width="96" height="23"
            /></a>
            <a class="brand-app" href="/" data-link aria-label="Marketing requests, home">Marketing<br />requests</a>
          </div>
          <button type="button" class="icon-btn side-close" data-close-nav aria-label="Close menu">
            <svg class="i" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <a class="btn lime new-btn" href="/new" data-link>
          <svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          New request
        </a>
        <nav class="nav" data-nav></nav>
        <div class="side-foot">
          <a href="/help" data-link class="side-link">Help &amp; how it works</a>
        </div>
      </aside>
      <div class="scrim" data-close-nav hidden></div>
      <div class="body">
        <header class="top">
          <button type="button" class="icon-btn menu-btn" data-open-nav aria-label="Open menu" aria-controls="side" aria-expanded="false">
            <svg class="i" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          </button>
          <a class="brand-mini" href="https://overyondrdev.com/" aria-label="Yondr Dev Portal — all portals"
            ><img src="/brand/yondr-dark-green.svg" alt="" width="80" height="19"
          /></a>
          <form class="search" role="search" data-search>
            <label class="visually-hidden" for="q">Search requests</label>
            <svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-3.5-3.5" />
            </svg>
            <input id="q" name="q" type="search" placeholder="Search requests" autocomplete="off" />
            <kbd aria-hidden="true">/</kbd>
          </form>
          <div class="top-actions">
            <button type="button" class="icon-btn bell" data-bell aria-label="Notifications" aria-haspopup="dialog" aria-expanded="false">
              <svg class="i" viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
                <path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9" />
                <path d="M10 19a2 2 0 0 0 4 0" />
              </svg>
              <span class="dot-count" data-bell-count hidden>0</span>
            </button>
            <button type="button" class="me-btn" data-me-btn aria-haspopup="menu" aria-expanded="false">
              <span class="avatar" data-me-avatar aria-hidden="true"></span>
              <span class="me-name" data-me-name></span>
            </button>
          </div>
        </header>
        <main id="main" tabindex="-1" aria-live="polite">
          <div class="page-loading" aria-label="Loading"><span class="spinner"></span></div>
        </main>
      </div>
    </div>
    <div class="popover" data-inbox role="dialog" aria-label="Notifications" hidden></div>
    <div class="menu" data-me-menu role="menu" hidden></div>
    <div class="toasts" data-toasts role="status" aria-live="polite"></div>
    <noscript><p class="noscript">The marketing request portal needs JavaScript turned on.</p></noscript>
  </body>
</html>
