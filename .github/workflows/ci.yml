name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege token for every job.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs (version in the comment); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:js
      - run: npm run check:secrets
      - run: npm run format:check
      - run: npm test
      # Bundles the Worker exactly as a deploy would, without deploying. Needs no Cloudflare credentials.
      - run: npx wrangler deploy --dry-run --outdir dist
      - run: npm audit --audit-level=high

# Deploys are done by Cloudflare Workers Builds (Git integration) on merge to main, not by Actions,
# so no Cloudflare secrets live in GitHub. See docs/setup.md.
